# Registry of the 50 municipal market-regulation sites (Plan §4.1, D1').
# Status semantics:
#   verified   — list_url fetched during build and returned parsable links
#   calibrate  — URL known, list structure not yet verified; adapter probes it
#   pending    — only the homepage is registered; needs manual calibration
# The pipeline NEVER fabricates records for a site that fails; failures are
# recorded in state (kv source_status:<slug>) and surfaced in the daily report.
#
# NOTE: the national penalty-document portal (collect.cfws) covers the same
# genre across all provinces and is the primary D1' intake; this registry is the
# planned municipal expansion layer (Plan: "先 10 个重点站后扩展").

defaults:
  link_keywords: ["处罚", "行政处罚", "食品", "公示"]
  detail_link_regex: "(?:art|content|t20\\d{6}|/\\d{4}/|show|detail)"
  list_item_limit: 60

